[build-system]
requires = ['setuptools >= 77.0.3', 'wheel']
build-backend = "setuptools.build_meta"

[project]
name = 'phonlab'
authors = [{name = "Keith Johnson", email = "kjohnson@berkeley.edu"},
            {name = "Ronald Sprouse", email = "ronald@berkeley.edu"}
]
description = "Python tools for phonetics"
readme = "README.rst"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
    'numpy>=2.2',
    'lazy_loader',
    'matplotlib>=3.10',
    'scipy>=1.15',
    'srt>=3.5',
    'colorednoise>=2.2',
    'pandas>=2.2',
    'librosa>=0.10',
    'praat-parselmouth>=0.4.5',
    'numba'
]
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering',
    'Topic :: Multimedia :: Sound/Audio :: Speech'
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/phonetics-projects/phonlab"
Issues = "https://github.com/phonetics-projects/phonlab/issues"

[tool.setuptools]
packages = [
    'phonlab',
    'phonlab.third_party',
    'phonlab.acoustic',
    'phonlab.artic',
    'phonlab.auditory',
    'phonlab.utils',
    'phonlab.data.noise',
    'phonlab.data.example_audio'
]

[tool.setuptools.dynamic]
version = {attr="phonlab.__version__"}

[tool.setuptools.package-data]
phonlab = ['*.txt', 'py.typed', 'data/noise/*.wav', 'data/example_audio/*']
